<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课堂演示</title><link rel="stylesheet" href="/legacy/player.css"><link rel="stylesheet" href="/legacy/revision.css"><link rel="stylesheet" href="/presentation.css"><link rel="stylesheet" href="/themes.css"><link rel="stylesheet" href="/dictionary.css"><script type="module" src="/themes.js"></script><link rel="icon" href="/icons/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v2.png"><script type="module" src="/icons-ui.js"></script><body class="player">
<aside class="floating-tools" aria-label="演示工具"><a id="home" class="icon-button" href="/" aria-label="返回工作台" title="返回工作台">⌂</a><span id="topic" hidden></span><strong id="doc-title" hidden></strong><button id="smaller" aria-label="减小字号">A−</button><input id="font" aria-label="字号" type="range" min="18" max="80" step="1" value="42" hidden><button id="larger" aria-label="增大字号">A+</button><span id="font-value" hidden>34</span><button id="fullscreen">全屏</button></aside>
<div class="progress-track"><div id="progress"></div></div>
<main id="workspace"><div class="question-meta"><div><span id="section"></span><span id="question-kind" class="pill"></span></div><span id="position"></span></div>
<div id="layout" class="layout"><section id="passage-panel" class="passage-panel" aria-label="阅读材料" hidden><header id="passage-heading">文章</header><div id="passage-content" class="passage-content" tabindex="0" aria-label="文章内容，可独立滚动"></div></section><article id="question-panel" class="question-panel" aria-live="polite"><div id="question-content"></div></article><aside id="side" class="side" hidden><div class="side-tabs"><button id="context-tab">题目材料</button><button id="explain-tab">解析与积累</button><button id="close-side" aria-label="收起侧栏">×</button></div><div id="side-content" class="side-content"></div></aside></div>
<div id="feedback" class="feedback" role="button" tabindex="0" aria-label="查看本题解析" aria-live="polite" hidden></div>
</main>
<footer class="bottom"><div class="nav-buttons"><button id="picker" aria-label="题目导航" title="题目导航">▦</button><button id="prev" aria-label="上一题" title="上一题">&lt;</button><button id="next" class="primary" aria-label="下一题" title="下一题">&gt;</button></div><div class="lesson-tools"><button id="show-answer" title="显示答案（Enter）" aria-label="显示答案">显示答案</button><button id="material">题目材料</button><button id="explain">查看解析</button><button id="reference">讲义与说明</button><button id="retry">重做</button></div><span id="score"></span></footer>
<dialog id="dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="关闭">×</button></div><div id="dialog-body"></div></dialog>
<script id="lesson-data" type="application/json"></script><script type="module" src="/player-boot.js"></script></body></html>
